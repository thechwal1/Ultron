<!DOCTYPE html>
<html>
<head>
    <script src="https://puter.com/puter.js/v2"></script>
</head>
<body>
    <script>
        async function askPuter(requestId, prompt, model) {
            try {
                const response = await puter.ai.chat(prompt, { model: model });
                AndroidBridge.onResult(String(requestId), response.message.content);
            } catch (err) {
                AndroidBridge.onError(String(requestId), err.message);
            }
        }
    </script>
</body>
</html>
